name: TestFlight

# Archives a Release build and uploads it to App Store Connect / TestFlight.
# Runs on version tags (v1.0.0, v1.0.1-beta, …) or manually from the Actions tab.
#
# Signing is cloud-managed: xcodebuild uses an App Store Connect API key to
# create/fetch the distribution certificate and provisioning profile, so no
# .p12 or profiles are stored in the repo or in secrets.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID          App Store Connect API key ID
#   ASC_ISSUER_ID       API key issuer ID
#   ASC_KEY_P8_BASE64   the downloaded AuthKey_XXXX.p8, base64-encoded
# The key needs the Admin role (cloud-managed distribution signing requires it).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Override build number (default: workflow run number)'
        required: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - uses: actions/checkout@v5

      # `runner.temp` is only available inside steps, not job-level env.
      - name: Set paths
        run: |
          echo "ARCHIVE_PATH=$RUNNER_TEMP/chattr.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/export" >> "$GITHUB_ENV"
          echo "KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; missing=1; fi
          done
          exit $missing

      - name: Install API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project chattr.xcodeproj \
            -scheme chattr \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcbeautify --renderer github-actions

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions
          echo "Uploaded build $BUILD_NUMBER — it appears in TestFlight once App Store Connect finishes processing." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep dSYMs
        uses: actions/upload-artifact@v5
        with:
          name: dSYMs-${{ env.BUILD_NUMBER }}
          path: ${{ env.ARCHIVE_PATH }}/dSYMs
          if-no-files-found: ignore

      - name: Remove API key
        if: always()
        run: rm -f "$KEY_PATH"
