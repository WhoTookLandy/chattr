name: CI

# Build + test on every push to main and every PR. This is the first place the
# code is actually compiled, so keep it fast and fail loudly.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: swift test (${{ matrix.package }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Features is iOS-only in practice (UIKit + iOS toolbar placements), so
        # it's tested on a simulator in the `features-tests` job below.
        package: [Core, DesignSystem, EmoteSources, Accounts, ChatModel, Channels]
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            Packages/${{ matrix.package }}/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles('Packages/*/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-${{ matrix.package }}-

      - name: swift test
        run: swift test --package-path "Packages/${{ matrix.package }}" --parallel

  features-tests:
    name: Features tests (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-features-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift') }}
          restore-keys: spm-features-${{ runner.os }}-

      - name: Test on iOS Simulator
        working-directory: Packages/Features
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          # SwiftPM generates "<Name>-Package" when a package has several
          # products/targets; otherwise the scheme is just the package name.
          SCHEME=$(xcodebuild -list -json | jq -r '.workspace.schemes as $s
            | if ($s | index("Features-Package")) then "Features-Package" else "Features" end')
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            | xcbeautify --renderer github-actions

  # Accounts also runs under host `swift test` above, but its UIKit-gated
  # code and tests (`#if canImport(UIKit)`: the OAuth callback parser) only
  # compile and run on iOS.
  accounts-tests:
    name: Accounts tests (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-accounts-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift') }}
          restore-keys: spm-accounts-${{ runner.os }}-

      - name: Test on iOS Simulator
        working-directory: Packages/Accounts
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          # SwiftPM generates "<Name>-Package" when a package has several
          # products/targets; otherwise the scheme is just the package name.
          SCHEME=$(xcodebuild -list -json | jq -r '.workspace.schemes as $s
            | if ($s | index("Accounts-Package")) then "Accounts-Package" else "Accounts" end')
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            | xcbeautify --renderer github-actions

  app-build:
    name: Build app (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-app-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift') }}
          restore-keys: spm-app-${{ runner.os }}-

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project chattr.xcodeproj \
            -scheme chattr \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  # The job above builds Debug. TestFlight archives Release, where the
  # optimizer and `#if DEBUG` blocks differ, so compile that too before a
  # tag finds out.
  app-build-release:
    name: Build app, Release (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-app-release-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift') }}
          restore-keys: spm-app-release-${{ runner.os }}-

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild build \
            -project chattr.xcodeproj \
            -scheme chattr \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  # Early warning for the iOS 27 SDK. The jobs above build with Xcode 26.6
  # (the newest on the GA macos-26 image); this one compiles the app and runs
  # the host-side package tests with Xcode 27 on GitHub's `xcode-27` preview
  # image. Non-blocking while that image is in preview. Simulator tests are
  # skipped here because the preview image's iOS 27 simulator runtime is
  # currently flaky (actions/runner-images#15334, #15337).
  # Once xcode-27 goes GA: move every job (and testflight.yml) onto it,
  # pin Xcode 27.x, and delete this job.
  xcode-27-preview:
    name: Xcode 27 (preview, non-blocking)
    runs-on: xcode-27
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: swift test (host-testable packages)
        run: |
          set -o pipefail
          for pkg in Core DesignSystem EmoteSources Accounts ChatModel Channels; do
            echo "::group::swift test $pkg"
            swift test --package-path "Packages/$pkg" --parallel
            echo "::endgroup::"
          done

      - name: Build app against the iOS 27 SDK
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project chattr.xcodeproj \
            -scheme chattr \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
